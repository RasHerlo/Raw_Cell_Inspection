[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-cell-inspection"
dynamic = ["version"]
description = "Draw guided ROIs on .tif movie stacks and collect their traces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyqtgraph>=0.13.7",
    "PySide6>=6.6",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[project.gui-scripts]
raw-cell-inspection = "raw_cell_inspection.app:main"

[tool.setuptools.dynamic]
version = { attr = "raw_cell_inspection.__version__" }

[tool.setuptools.packages.find]
include = ["raw_cell_inspection*"]
